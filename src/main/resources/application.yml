spring:
  application:
    name: cgovern
  datasource:
    url: jdbc:h2:file:./data/cgovern;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: true
    show-sql: false
  thymeleaf:
    cache: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

cgovern:
  demo-user:
    email: admin@cgovern.dev
    password: admin123
    name: CGovern Admin
