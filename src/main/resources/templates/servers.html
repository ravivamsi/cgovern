<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<body>
<section th:fragment="content">
  <h1>Remote servers</h1>
  <p class="muted">Add a worker in one form. Remove unassigns any jobs that pointed at it. Leave the secret blank to auto-generate one.</p>
  <p th:if="${message}" class="flash" th:text="${message}"></p>

  <form class="panel compact" th:action="@{/servers}" th:object="${server}" method="post">
    <input type="hidden" th:field="*{id}"/>
    <h3 th:text="*{id} == null ? 'Add server' : 'Update server'">Add server</h3>
    <div class="form-grid">
      <div>
        <label>Name</label>
        <input th:field="*{name}" required placeholder="ci-worker-east"/>
      </div>
      <div>
        <label>Region</label>
        <input th:field="*{region}" required placeholder="us-east-1"/>
      </div>
      <div>
        <label>Agent URL</label>
        <input th:field="*{baseUrl}" required placeholder="https://agent.example:8443"/>
      </div>
      <div>
        <label>Shared secret</label>
        <input th:field="*{sharedSecret}" placeholder="auto-generated if empty"/>
      </div>
      <div>
        <label>Capabilities</label>
        <input th:field="*{allowedCapabilities}" placeholder="BUILD,TEST,DEPLOY,MONITOR"/>
      </div>
      <div>
        <label>Mode</label>
        <select th:field="*{simulated}">
          <option th:value="true">simulated</option>
          <option th:value="false">live</option>
        </select>
      </div>
    </div>
    <p class="row-actions">
      <button type="submit" th:text="*{id} == null ? 'Add server' : 'Save changes'">Add server</button>
      <a class="btn secondary" th:if="*{id} != null" th:href="@{/servers}">Cancel</a>
    </p>
  </form>

  <div class="table-wrap">
    <table>
      <thead><tr><th>Name</th><th>Region</th><th>URL</th><th>Capabilities</th><th>Mode</th><th></th></tr></thead>
      <tbody>
        <tr th:each="s : ${servers}">
          <td th:text="${s.name}"></td>
          <td th:text="${s.region}"></td>
          <td><code th:text="${s.baseUrl}"></code></td>
          <td th:text="${s.allowedCapabilities}"></td>
          <td th:text="${s.simulated} ? 'simulated' : 'live'"></td>
          <td class="row-actions">
            <a class="btn secondary" th:href="@{|/servers/${s.id}/edit|}">Edit</a>
            <form th:action="@{|/servers/${s.id}/delete|}" method="post" class="inline"
                  onsubmit="return confirm('Remove this server from the control plane?');">
              <button class="danger" type="submit">Remove</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
</body>
</html>
