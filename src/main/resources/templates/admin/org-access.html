<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<body>
<section th:fragment="content">
  <p class="crumb"><a th:href="@{/admin}">Admin</a> / <span th:text="${organization.name}">org</span></p>
  <h1>Access for <span th:text="${organization.name}">org</span></h1>
  <p class="muted">ADMIN can change the org catalog. MEMBER can run jobs. VIEWER is read-only intent for future UI gates.</p>
  <p th:if="${message}" class="flash" th:text="${message}"></p>
  <p th:if="${error}" class="flash" th:text="${error}"></p>

  <form class="panel compact" th:action="@{|/admin/orgs/${organization.id}/members|}" method="post">
    <h3>Add person</h3>
    <div class="form-grid">
      <div>
        <label>Registered email</label>
        <input type="email" name="email" required placeholder="member@cgovern.dev"/>
      </div>
      <div>
        <label>Org role</label>
        <select name="role">
          <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
        </select>
      </div>
    </div>
    <p><button type="submit">Grant access</button></p>
  </form>

  <div class="table-wrap">
    <table>
      <thead><tr><th>Name</th><th>Email</th><th>Role</th><th></th></tr></thead>
      <tbody>
        <tr th:each="m : ${members}">
          <td th:text="${m.user.fullName}"></td>
          <td th:text="${m.user.email}"></td>
          <td>
            <form th:action="@{|/admin/members/${m.id}/role|}" method="post" class="inline">
              <input type="hidden" name="orgId" th:value="${organization.id}"/>
              <select name="role">
                <option th:each="r : ${roles}" th:value="${r}" th:text="${r}" th:selected="${m.role == r}"></option>
              </select>
              <button type="submit">Update</button>
            </form>
          </td>
          <td>
            <form th:action="@{|/admin/members/${m.id}/revoke|}" method="post" class="inline">
              <input type="hidden" name="orgId" th:value="${organization.id}"/>
              <button class="danger" type="submit">Remove</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
    <p th:if="${#lists.isEmpty(members)}" class="muted">Nobody has been granted access yet.</p>
  </div>
</section>
</body>
</html>
