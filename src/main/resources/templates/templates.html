<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<body>
<section th:fragment="content">
  <h1>Job templates</h1>
  <p><a class="btn" th:href="@{/templates/new}">Add template</a></p>
  <div class="grid">
    <article class="card" th:each="t : ${templates}">
      <h3 th:text="${t.name}">name</h3>
      <p class="pill" th:text="${t.module}"></p>
      <p class="muted" th:text="${t.description}"></p>
      <p><code th:text="${t.sampleTasks}"></code></p>
    </article>
  </div>
</section>
</body>
</html>
